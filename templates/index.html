<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Manager</title>
</head>
<body>
    <h2>User Registration</h2>
    <input type="text" required id="name" placeholder="Enter Name">
    <input type="text" id="age" placeholder="Enter Age">
    <input type="text" id="dep" placeholder="Enter Department">
    <button onclick="addUser()">Add User</button>

    <h2>User List</h2>
    <table border="1" id="userTable">
        <thead>
            <tr><th>ID</th><th>Name</th><th>Age</th><th>Department</th><th>Actions</th></tr>
        </thead>
        <tbody></tbody>
    </table>

    <!-- Edit Modal -->
    <div id="editModal" style="display:none; position:fixed; top:30%; left:35%; padding:20px; border:1px solid #ccc; background:#f4f4f4;">
        <h3>Edit User</h3>
        <input type="hidden" id="editUserId">
        <input type="text" id="editName" placeholder="New Name"><br><br>
        <input type="text" id="editAge" placeholder="New Age"><br><br>
        <input type="text" id="editDep" placeholder="New Department"><br><br>
        <button onclick="confirmEdit()">Confirm Edit</button>
        <button onclick="closeEditModal()">Cancel</button>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
