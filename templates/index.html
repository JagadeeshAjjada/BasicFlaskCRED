<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="p-5 bg-light">

<div class="container">
    <h2 class="mb-4">User Registration</h2>
    <div class="row g-2 mb-3">
        <div class="col-md-4">
            <input type="text" id="name" class="form-control" placeholder="Enter Name">
        </div>
        <div class="col-md-2">
            <input type="number" id="age" class="form-control" placeholder="Enter Age">
        </div>
        <div class="col-md-4">
            <input type="text" id="dep" class="form-control" placeholder="Enter Department">
        </div>
        <div class="col-md-2 d-grid">
            <button class="btn btn-primary" onclick="addUser()">Add User</button>
        </div>
    </div>

    <h2 class="mt-5">User List</h2>
    <table class="table table-bordered table-striped mt-3" id="userTable">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Department</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<!-- Bootstrap Modal for Edit -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editModalLabel">Edit User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editUserId">
        <div class="mb-3">
          <label for="editName" class="form-label">Name</label>
          <input type="text" class="form-control" id="editName">
        </div>
        <div class="mb-3">
          <label for="editAge" class="form-label">Age</label>
          <input type="number" class="form-control" id="editAge">
        </div>
        <div class="mb-3">
          <label for="editDep" class="form-label">Department</label>
          <input type="text" class="form-control" id="editDep">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-success" onclick="confirmEdit()">Confirm Edit</button>
      </div>
    </div>
  </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
